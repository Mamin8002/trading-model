# ПРИМЕР конфигурации крипторежима (схема: src/tradebot/config/schema.py,
# docs/architecture.md §3.4). Значения lookback_bars/horizon_bars — ОБЯЗАТЕЛЬНЫЕ
# и явные: ничего не подбирается молча при запуске. Измените их под свою стратегию.
#
# СЕКРЕТОВ В КОНФИГЕ НЕТ. Подключение к криптобирже НЕ реализовано
# (exchange/base.py): бот работает офлайн на локальных CSV, LIVE заблокирован.
# Когда биржевой адаптер появится, API-ключи будут читаться только из окружения.

run:
  mode: TEST                # LIVE в крипто-версии заблокирован гейтом (docs/live.md)
  experiment_id: example-btcusdt-5m-v1

data:
  csv_dir: data/raw         # подставьте свои CSV; формат описан в docs/data.md
  symbols:
    - ticker: BTCUSDT       # торговая пара в формате вашей биржи (например BTCUSDT, BTC/USDT)
      files:
        "1m": BTCUSDT_M1.csv   # имена файлов — ЗАГЛУШКИ-ПРИМЕРЫ; положите свои файлы в csv_dir
        "5m": BTCUSDT_M5.csv
  # ЯВНАЯ семантика метки времени в ваших CSV: bar_open (метка = начало бара) или
  # bar_close (метка = конец бара). Уточните в документации вашей выгрузки
  # (docs/data.md, раздел "Время").
  timestamp_semantics: bar_open
  source_timezone: UTC      # криптобиржи отдают свечи в UTC (docs/data.md §2);
                            # если ваш экспорт в другой зоне — укажите её явно
  volume_units: base_asset  # volume в единицах базового актива (BTC); у некоторых
                            # выгрузок — quote_asset (USDT): проверьте и укажите верно

# КАЖДЫЙ включённый таймфрейм обязан иметь явные lookback_bars и horizon_bars.
timeframes:
  "5m":
    enabled: true
    lookback_bars: 240      # ПРИМЕР: глубина истории для признаков (баров 5m)
    horizon_bars: 6         # ПРИМЕР: горизонт прогноза (баров 5m)
    label:
      kind: fwd_return_class
      neutral_band_bps: 3.0
  "10m":
    enabled: true
    base_timeframe: "5m"    # ОБЯЗАТЕЛЬНО для 10m: нативных 10m-свечей биржи обычно
                            # не отдают — строим локально из 5m (decisions D3)
    lookback_bars: 120      # ПРИМЕР
    horizon_bars: 3         # ПРИМЕР
    label:
      kind: fwd_return_class
      neutral_band_bps: 4.0
  "15m":
    enabled: false          # включите и задайте свои значения при необходимости
    lookback_bars: 96
    horizon_bars: 4
  "1h":
    enabled: false
    lookback_bars: 72
    horizon_bars: 2

# Крипторынок работает 24/7 — календарь круглосуточный (окно 00:00-24:00 UTC
# во все дни недели). Если у вашей биржи бывают техобслуживания/окна торгов —
# опишите их здесь же. Секцию sessions можно не задавать: тогда пропуски
# считаются по равномерной сетке, а разрывы выглядят как warnings W_GAP.
sessions:
  timezone: UTC
  days:
    - days: [0, 1, 2, 3, 4, 5, 6]   # 0=понедельник ... 6=воскресенье
      sessions:
        - { start: "00:00", end: "24:00" }

validation:
  max_reported_issues: 50
  warn_zero_volume: true
