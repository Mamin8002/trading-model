# ПРИМЕР конфигурации обучения (фаза 3). Скопируйте и заполните под свои данные.
# Базовые секции (run/data/timeframes/sessions/validation/finam) описаны в
# configs/example.yaml и docs/data.md; ML-секции — в docs/ml.md.
#
# Все значения lookback_bars / horizon_bars / периоды индикаторов / параметры
# модели / пороги — ЯВНЫЕ: подбирайте их до запуска и фиксируйте (decisions D6:
# подбор на валидационных фолдах запрещён).

run:
  mode: TEST
  experiment_id: sber-5m-ml-v1
  model_dir: models        # каталог артефактов моделей (исключён из git)
  report_dir: reports      # каталог отчётов (исключён из git)

data:
  csv_dir: data/raw
  symbols:
    - ticker: SBER
      mic: MISX
      files:
        "1m": SBER_M1.csv      # ваши файлы; имена — заглушки-примеры
        "5m": SBER_M5.csv
  timestamp_semantics: bar_open   # подтвердите по вашим данным (docs/data.md §2)
  source_timezone: Europe/Moscow
  volume_units: pieces

timeframes:
  "5m":
    enabled: true
    lookback_bars: 240       # >= warmup набора признаков v1 (61 бар по умолчанию)
    horizon_bars: 6          # горизонт метки, баров 5m (= 30 минут)
    base_timeframe: "1m"     # не обязателен для 5m (есть прямой файл)
    label:
      kind: fwd_return_class # fwd_return_class | fwd_return_reg (triple_barrier — не реализован)
      neutral_band_bps: 5.0  # ≈ комиссия + слиппедж на сторону; движение в полосе не торгуется
  "10m":
    enabled: false
    base_timeframe: "5m"     # ОБЯЗАТЕЛЬНО: в Finam API нет TIME_FRAME_M10 (decisions D3)
    lookback_bars: 120
    horizon_bars: 3
    label: { kind: fwd_return_class, neutral_band_bps: 6.0 }

features:
  set: v1                    # единственный реализованный набор (docs/ml.md §2)
  params:
    rsi_period: 14
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    atr_period: 14
    ema_periods: [8, 21, 50]
    return_lags: [1, 3, 5, 10, 21]
    vol_windows: [12, 48]    # по возрастанию
    volume_window: 20
    volume_trend_window: 60

model:
  kind: lightgbm             # catboost в фазе 3 не подключён (decisions D4/P1)
  seed: 42                   # фиксированный seed — воспроизводимость
  params:
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 31
    max_depth: -1
    min_child_samples: 50
    subsample: 1.0           # 1.0 = без bagging (детерминированность)
    subsample_freq: 0
    colsample_bytree: 0.9
    reg_alpha: 0.0
    reg_lambda: 0.0
    early_stopping_holdout_bars: 0   # >0: holdout ВНУТРИ train-окна (валидация не трогается)
    early_stopping_rounds: 30

validation:
  max_reported_issues: 50
  warn_zero_volume: true
  walk_forward:
    n_splits: 5
    embargo_bars: null       # null = автоматически horizon_bars (минимум честности);
                             # явное значение обязано быть >= horizon_bars
    min_train_bars: 1000
    min_val_bars: 100
    audit_random_split: true # аудит «random vs walk-forward» (architecture §6.8)
  thresholds:                # диагностические пороги, фиксируются ДО обучения
    min_oos_auc: 0.52
    min_oos_trades: 20

evaluation:                  # допущения оценочной симуляции (docs/ml.md §5)
  commission_bps: 3.0        # ОЦЕНОЧНОЕ допущение, не фактический тариф (research Q9)
  slippage_bps: 2.0          # ОЦЕНОЧНОЕ допущение
  decision_threshold: 0.5    # P(up) >= порога -> длинная позиция (long-only)
  trading_days_per_year: 252
  bars_per_year: null        # null = вывести из данных (медиана баров/день × 252)
  risk_free_annual: 0.0

sessions:
  timezone: Europe/Moscow
  days:
    - days: [0, 1, 2, 3, 4]
      sessions:
        - { start: "10:00", end: "18:50" }   # ПРИМЕР — сверьте с фактическим расписанием
        - { start: "19:05", end: "23:50" }   # ПРИМЕР

finam:
  base_url: https://api.finam.ru
  bar_timestamp_semantics: null  # задайте после эмпирической проверки (research Q3)
