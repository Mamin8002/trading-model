# ДЕМО-конфигурация TEST-симулятора (docs/simulation.md) для крипторежима.
#
# ВСЕ финансовые значения ниже — ЯВНЫЕ ДЕМОНСТРАЦИОННЫЕ ДОПУЩЕНИЯ,
# а не реальные тарифы/параметры инструмента. Замените их своими данными:
# - price_step и lot_size_units — из ПОДТВЕРЖДЁННОГО источника (спецификация
#   пары на вашей бирже, например tickSize/stepSize). Выдумывать параметры
#   инструмента запрещено; null = параметр не подтверждён -> зависимые проверки
#   безопасно откладываются и это фиксируется в журнале;
# - комиссии/слиппедж — ваши оценочные допущения (реальные тарифы биржи
#   уточняйте в её документации);
# - лимиты риска — ваши правила. Без них симулятор БЕЗОПАСНО ОТКАЗЫВАЕТСЯ стартовать.
#
# Данные: синтетический демо-файл data/demo/DEMO_M1.csv (НЕ рыночные данные;
# 10080 минутных баров = 7 суток 24/7, 2024-01-03 18:00 — 2024-01-10 17:59 UTC).

run:
  mode: TEST
  experiment_id: sim-demo
  model_dir: models
  report_dir: reports

data:
  csv_dir: data/demo
  symbols:
    - ticker: DEMO
      files:
        "1m": DEMO_M1.csv   # 5m строится ресэмплингом из 1m (base_timeframe ниже)
  timestamp_semantics: bar_open
  source_timezone: UTC
  volume_units: base_asset

timeframes:
  "5m":
    enabled: true
    base_timeframe: "1m"
    lookback_bars: 240
    horizon_bars: 6
    label: { kind: fwd_return_class, neutral_band_bps: 5.0 }

# ---------------------------------------------------------------------------
# Риск-контроль (все значения — ДЕМО-допущения, задаются явно)
risk:
  initial_capital_quote: 100000.0   # ДЕМО-капитал в валюте котировки
  position_units: null              # фиксированный режим отключён
  risk_per_trade_quote: 500.0       # ДЕМО: макс. убыток на сделку (требует стоп в сигнале)
  max_position_units: 100           # ДЕМО-лимит позиции (единиц базового актива)
  max_orders_per_day: 10            # ДЕМО-лимит числа входов в сутки (UTC)
  daily_loss_limit_quote: 1500.0    # ДЕМО-лимит убытка за локальный день
  max_drawdown_pct: 5.0             # ДЕМО-предел просадки от пика капитала, %
  max_data_age_seconds: 3600        # ДЕМО-порог свежести данных (в TEST-replay возраст = 0)
  allow_short: false                # long-only (шорты не реализованы; маржа/фьючерсы —
                                    # отложенное решение, docs/decisions.md D15)
  halt_on_limit_breach: true        # нарушение дневного лимита/просадки -> остановка входов

# Параметры инструмента — ДЕМО-значения (для реальной пары брать из
# подтверждённого источника — спецификации биржи; null = параметр не подтверждён)
instrument:
  price_step: 0.01        # ДЕМО-допущение шага цены
  lot_size_units: 1       # ДЕМО (целые единицы базового актива; дробные количества — D14)
  quote_currency: USDT    # ДЕМО-валюта котировки (только для отчётов/журнала)

# ---------------------------------------------------------------------------
# TEST-симулятор исполнения
simulation:
  commission_bps: 3.0         # ДЕМО-допущение комиссии (не фактический тариф биржи)
  commission_min_quote: 1.0   # ДЕМО-минимум на сделку
  slippage_bps: 2.0           # ДЕМО-допущение проскальзывания (невыгодной стороной)
  conflict_policy: stop_first # консервативное правило «стоп и цель в одной свече»
                              # (альтернатива require_intrabar_data — остановка с
                              #  требованием внутрибарных данных; docs/simulation.md §4)
  journal_path: null          # null -> reports/journal_<experiment>_<tf>.jsonl
  signal:
    entry_threshold: 0.55     # вход при proba >= порога
    exit_threshold: 0.45      # выход при proba <= порога (null = только стоп/цель)
    stop_bps: 100.0           # ДЕМО-стоп: 1% от цены ФИЛЛА (округляется консервативно до шага)
    target_bps: 200.0         # ДЕМО-цель: 2% от цены филла

# Крипторынок 24/7: круглосуточный календарь
sessions:
  timezone: UTC
  days:
    - days: [0, 1, 2, 3, 4, 5, 6]
      sessions:
        - { start: "00:00", end: "24:00" }

evaluation:
  trading_days_per_year: 365  # крипторынок без выходных (docs/data.md §3)
  bars_per_year: null         # null = вывести из данных (медиана баров/день × 365)
