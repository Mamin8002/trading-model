# ДЕМО-конфигурация для офлайн-проверок на СИНТЕТИЧЕСКИХ данных (крипторежим).
# ВАЖНО: data/demo/DEMO_M1.csv — искусственные демонстрационные данные
# (детерминированный шаблон цены/объёма, 10080 минутных баров = 7 суток
# 2024-01-03 18:00 — 2024-01-10 17:59 UTC, серия непрерывная, проходит через
# полночи и выходные), НЕ реальные рыночные данные.
# Символ DEMO выбран намеренно, чтобы не путать с реальной торговой парой.

run:
  mode: TEST
  experiment_id: demo-crypto

data:
  csv_dir: data/demo
  symbols:
    - ticker: DEMO            # символ пары (формат биржи; для демо — условный)
      files:
        "1m": DEMO_M1.csv
  timestamp_semantics: bar_open   # демо-файл сгенерирован с меткой начала бара
  source_timezone: UTC            # соглашение крипторынка: метки CSV в UTC (docs/data.md §2)
  volume_units: base_asset        # объём в единицах базового актива (демо — условные единицы)

timeframes:
  "5m":
    enabled: true
    lookback_bars: 12    # демо-значения: 120 минутных баров = 24 пятиминутных
    horizon_bars: 2
  "10m":
    enabled: true
    base_timeframe: "5m"  # 10m строится локальным ресэмплингом из 5m (decisions D3)
    lookback_bars: 6
    horizon_bars: 1
  "15m":
    enabled: true
    lookback_bars: 4
    horizon_bars: 1
  "1h":
    enabled: true
    lookback_bars: 1
    horizon_bars: 1

# Крипторынок работает круглосуточно: календарь 24/7 (окно 00:00-24:00 UTC во все
# дни недели). Демо-серия непрерывна, поэтому валидатор не выдаёт W_GAP/
# W_OUT_OF_SESSION. Альтернатива — вообще не задавать sessions (пропуски
# считаются по равномерной сетке).
sessions:
  timezone: UTC
  days:
    - days: [0, 1, 2, 3, 4, 5, 6]
      sessions:
        - { start: "00:00", end: "24:00" }

validation:
  max_reported_issues: 50
  warn_zero_volume: true
