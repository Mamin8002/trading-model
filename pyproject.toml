[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradebot"
version = "0.1.0"
description = "MOEX trading bot skeleton: config, CSV data layer, resampling, read-only Finam Trade API adapter (Phase 0-2)"
readme = "README.md"
requires-python = ">=3.10"
# Обоснование зависимостей (docs/architecture.md §8, docs/decisions.md D10):
# - pydantic: строгая схема конфигурации (валидация до запуска);
# - PyYAML: декларативные YAML-конфиги;
# - tzdata: IANA-таймзоны (Europe/Moscow) через zoneinfo на Windows (у пользователя PowerShell).
# Extra "ml" (фаза 3, docs/ml.md): numpy/pandas — расчёт признаков и датасет;
# lightgbm — основной кандидат моделей (decisions D4); pin <5: в 4.7 помечен
# deprecated eval_set API, до 5.x не переходим без отдельной проверки;
# scikit-learn — метрики и логистический базовый ориентир (D4);
# pyarrow — сохранение датасетов (architecture §3.2).
# Extra "dev": pytest.
dependencies = [
    "pydantic>=2,<3",
    "PyYAML>=6",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
ml = [
    "numpy>=1.26,<3",
    "pandas>=2.0",
    "lightgbm>=4.0,<5",
    "scikit-learn>=1.3",
    "pyarrow>=14",
]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tradebot = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
