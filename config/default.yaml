# Конфигурация бота мониторинга BTC (Bybit, public data only).
# Секреты не требуются и нигде не используются: бот работает только
# с публичными рыночными данными. Не добавляйте сюда API-ключи.

# TEST  - офлайн-прогон на сохранённых данных и демонстрационных сценариях
# LIVE  - публичные данные Bybit в реальном времени (WebSocket)
mode: TEST

exchange:
  source: bybit            # интерфейс MarketDataSource позволяет добавить другие биржи
  category: spot           # spot | linear | inverse (по документации Bybit v5)
  symbol: BTCUSDT          # только uppercase
  interval: "5"            # код интервала Bybit: 1,3,5,15,30,60,120,240,360,720,D,W,M
  rest_base_url: https://api.bybit.com
  ws_public_url: wss://stream.bybit.com/v5/public/spot
  request_timeout_s: 15
  min_request_interval_s: 0.35   # троттлинг REST: ~3 req/s (IP-лимит Bybit 600 req/5s)
  max_retries: 5

model:
  algorithm: xgboost       # по выводу исходного репозитория: XGBoost лучший на 5-min данных
  horizon_bars: 3          # на сколько баров вперёд смотреть: 3 бара x 5 мин = 15 минут
                           # (диапазон задачи 10-15 мин = horizon_bars 2..3 при interval=5)
  confidence_threshold: null  # null = порог из model card (выбран при обучении БЕЗ утечки);
                              # число (0.5..1.0] = ручное переопределение
  random_seed: 42
  feature_set: auto        # auto | raw | ratio | v2; auto = сравнить ratio и v2
                           # walk-forward'ом и применить pre-registered adopt-gate
  n_estimators: 100        # дефолты XGBoost, как в исходном ноутбуке
  max_depth: 6
  learning_rate: 0.3
  artifact_dir: null       # null = последний ПРИНЯТЫЙ (adopted) артефакт из data.models_dir

# Издержки для симуляции торговли и paper trading (задаются ЯВНО, влияют на net-метрики)
trading:
  fee_pct: 0.1             # комиссия за сторону, % (Bybit spot taker 0.1%)
  slippage_pct: 0.02       # проскальзывание за сторону, %
  order_size_quote: 100    # виртуальный объём сделки, USDT

data:
  history_start: "2024-01-01"  # начало истории для загрузки/обучения (UTC)
  raw_dir: data/raw
  processed_dir: data/processed
  models_dir: data/models

signals:
  stale_after_intervals: 3     # нет обновлений дольше N*interval -> данные устарели (STALE),
                               # новый сигнал не выдаётся, рекомендации по позиции не выдаются
  history_display_bars: 10     # сколько последних свечей показывать в консоли

stream:
  ping_interval_s: 20          # app-level ping (рекомендация Bybit WS)
  connect_timeout_s: 10
  recv_timeout_s: 1
  reconnect_base_s: 1.0        # backoff переподключения: 1, 2, 4, ... секунд
  reconnect_max_s: 60.0        # не чаще лимитов Bybit (<=500 соединений/5мин)
  backfill_on_reconnect: true  # догрузка пропущенных закрытых свечей через публичный REST
  history_bars: 300            # глубина истории закрытых баров в памяти

positions:
  # Явные условия выхода для сопровождения позиций. null = правило НЕ задано:
  # бот не изобретает уровни стоп-лосса/целей/срока удержания, а при отсутствии
  # любых правил воздерживается от рекомендации НА ВХОД (сигналы при этом
  # фиксируются). Правила можно также задать при регистрации позиции
  # (position_cli.py register-entry --tp/--sl/--max-hold) - они приоритетнее.
  exit_rules:
    take_profit_pct: null      # например 1.5 = +1.5% от цены входа
    stop_loss_pct: null        # например 1.0 = -1.0% от цены входа
    max_hold_bars: null        # например 12 баров (= 60 минут при interval=5)
  allow_short: false           # spot: SELL НЕ открывает короткую позицию

ui:
  mode: auto        # auto = dash в терминале с ANSI, иначе line (строка на месте);
                    # line  - ОДНА статусная строка обновляется на месте (\r),
                    #         значимые события (сигнал/соединение/STALE/рекомендация) -
                    #         отдельными строками раз в несколько минут;
                    # dash  - полноэкранный дашборд (alternate screen, без следов в scrollback);
                    # block - полный снимок печатается только при изменениях (для логов/pipe)
  log_events: true  # печатать значимые события отдельными строками (line/block)
  refresh_s: 1.0    # частота обновления статусной строки
  colors: auto      # auto = включать цвет только при поддержке ANSI

intrabar:
  # Внутрисвечной анализ по потоку сделок publicTrade (LIVE). Spike = АЛЕРТ,
  # НЕ сигнал входа: вход только по модели на закрытом баре + фильтры стратегии.
  subscribe_trades: true   # подписка на publicTrade.{symbol}
  window_s: 60             # скользящее окно оценки быстрого движения, с
  spike_pct: 0.15          # движение >= X% за окно -> алерт
  cooldown_s: 300          # не повторять алерт чаще раза в N с

paper:
  # Paper trading: ВИРТУАЛЬНЫЕ позиции. Ордера не отправляются, приватный API не
  # используется. Издержки - из секции trading; правила выхода - positions.exit_rules
  # (фиксируются снимком при открытии и не меняются молча во время работы).
  enabled: true              # в LIVE; в TEST-реплее включается флагом --paper
  initial_balance_quote: 10000
  entry_min_confidence: null # null = порог модели (из card/конфига)
  cooldown_bars: 1           # пауза после закрытия, баров
  max_open_positions: 1      # конфликтующие позиции не открываются
  intrabar_exits: true       # SL/TP по тикам в LIVE (в TEST/реплее - по закрытым барам)
  exit_at_horizon: true      # закрывать позицию по истечении горизонта прогноза (H баров)
  partial_tp:                # частичная фиксация прибыли (не обязательна)
    enabled: false
    at_pct: null             # например 0.8 = +0.8% от входа
    fraction: 0.5            # доля позиции

journal:
  path: data/journal/journal.json   # история сигналов + ручные позиции (переживает перезапуск)
